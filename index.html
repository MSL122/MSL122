<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Los Santos Police Department v8.0</title>
<style>
:root{--bg:#061426;--panel:#0b2038;--panel2:#102b4a;--line:#274663;--text:#f5f8fc;--muted:#9db0c4;--blue:#2385ff;--red:#e64c4c}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#06111f,#071b30);color:var(--text);font:14px Arial,Helvetica,sans-serif}
header{background:#071525;border-bottom:1px solid #193653;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:800}.badge{width:42px;height:42px;border:2px solid #d8b85a;border-radius:50%;display:grid;place-items:center;color:#d8b85a;font-weight:900;font-size:11px}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #315474;background:#102b48;color:white;border-radius:7px;padding:9px 13px;cursor:pointer}.btn.primary{background:#1769cf;border-color:#2b8cff}.btn.danger{background:#a92d35;border-color:#d84b54}
nav{display:flex;gap:2px;background:#091a2d;border-bottom:1px solid #1d3954;padding:0 14px}nav button{background:transparent;border:0;color:#b8c8d9;padding:13px 18px;cursor:pointer}nav button.active{color:#5aa7ff;border-bottom:2px solid #2e8cff}
main{padding:18px;max-width:1500px;margin:auto}.title{background:#0c2948;border:1px solid #234665;border-radius:8px 8px 0 0;text-align:center;font-size:32px;font-weight:800;padding:20px}
.toolbar{background:#0a2036;border:1px solid #234665;border-top:0;padding:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.toolbar input{background:#07182a;border:1px solid #31516d;color:white;border-radius:6px;padding:9px 12px;min-width:260px}
.tablewrap{overflow:auto;border:1px solid #234665;border-top:0;border-radius:0 0 8px 8px}.table{min-width:1150px;width:100%;border-collapse:collapse;background:#071b2e}.table th{background:#102d4d;padding:11px;border:1px solid #31506d;font-size:13px}.table td{padding:9px;border:1px solid #1e3a54;text-align:center}.table tbody tr:hover{background:#0d2842}.group td{background:#14385f;font-weight:800;color:#fff;padding:8px}.rank{font-size:19px;letter-spacing:2px;color:#d9e1ea}.actions-cell{white-space:nowrap}.iconbtn{border:0;border-radius:5px;padding:7px 9px;color:#fff;cursor:pointer;margin:2px}.edit{background:#1d70cf}.del{background:#b6323a}
.modal{display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.card{background:#0b2038;border:1px solid #315474;border-radius:10px;padding:20px;width:min(600px,100%)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;color:#b8c8d9;margin-bottom:5px}.field input,.field select{width:100%;background:#07182a;color:#fff;border:1px solid #315474;border-radius:6px;padding:9px}.wide{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
footer{text-align:center;color:#7890a8;padding:22px}
@media(max-width:700px){.formgrid{grid-template-columns:1fr}.brand{font-size:17px}.title{font-size:23px}}
</style>
</head>
<body>
<header>
<div class="brand"><div class="badge">LSPD</div>Los Santos Police Department</div>
<div class="actions"><button class="btn" id="exportBtn">⬇ Export</button><button class="btn" id="resetBtn">↺ Reset demo</button><button class="btn primary" id="addBtn">＋ Add officer</button></div>
</header>
<nav><button class="active">👥 Members</button><button>🚓 Squads</button><button>📋 Reports</button><button>⚙ Administration</button></nav>
<main>
<div class="title">Los Santos Police Department</div>
<div class="toolbar"><input id="search" placeholder="Search name, BN, rank or section..."><div><span id="count"></span></div></div>
<div class="tablewrap"><table class="table"><thead><tr>
<th>BN</th><th>Names</th><th>Rank</th><th>Administrative rank</th><th>Section</th><th>Points</th><th>V.P</th><th>Stripes</th><th>Service Since</th><th>Certificates</th><th>Actions</th>
</tr></thead><tbody id="body"></tbody></table></div>
<footer>Los Santos Police Department v8.0 · Editable roster · Changes saved in this browser</footer>
</main>

<div class="modal" id="modal"><div class="card"><h2 id="modalTitle">Add officer</h2>
<form id="form"><div class="formgrid">
<div class="field"><label>BN</label><input name="bn"></div>
<div class="field"><label>Name</label><input name="name" required></div>
<div class="field"><label>Rank</label><select name="rank"><option>Police Chief</option><option>Captain</option><option>Lieutenant</option><option>Sergeant</option><option>Officer</option></select></div>
<div class="field"><label>Administrative rank</label><input name="admin"></div>
<div class="field"><label>Section</label><select name="section"><option>Patrol Division</option><option>Detective Bureau</option><option>Traffic Division</option><option>Internal Affairs</option><option>Administration</option></select></div>
<div class="field"><label>Points</label><input name="points" type="number" min="0" value="0"></div>
<div class="field"><label>V.P</label><input name="vp" type="number" min="0" value="0"></div>
<div class="field"><label>Stripes</label><input name="stripes"></div>
<div class="field"><label>Service Since</label><input name="service" type="date"></div>
<div class="field"><label>Certificates</label><input name="cert"></div>
</div><div class="modal-actions"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary">Save</button></div></form>
</div></div>
<script>
const seed=[
{bn:"101",name:"MT | Abdullah",rank:"Police Chief",admin:"Police Chief",section:"Administration",points:0,vp:0,stripes:"★★★★★",service:"2024-01-01",cert:"🏅"},
{bn:"102",name:"MT | JASER",rank:"Captain",admin:"Captain",section:"Patrol Division",points:120,vp:15,stripes:"Ⅱ",service:"2024-02-10",cert:"—"},
{bn:"103",name:"DRAKOLA",rank:"Captain",admin:"Captain",section:"Patrol Division",points:110,vp:12,stripes:"Ⅱ",service:"2024-02-15",cert:"—"},
{bn:"104",name:"Carizma",rank:"Captain",admin:"Captain",section:"Patrol Division",points:105,vp:10,stripes:"Ⅱ",service:"2024-02-20",cert:"—"},
{bn:"105",name:"MT | Azzz",rank:"Captain",admin:"Captain",section:"Patrol Division",points:100,vp:8,stripes:"Ⅱ",service:"2024-02-25",cert:"—"},
{bn:"201",name:"JUST",rank:"Lieutenant",admin:"Lieutenant",section:"Detective Bureau",points:80,vp:4,stripes:"Ⅰ",service:"2024-03-12",cert:"—"},
{bn:"202",name:"MT | Hatem",rank:"Lieutenant",admin:"Lieutenant",section:"Detective Bureau",points:75,vp:3,stripes:"Ⅰ",service:"2024-03-15",cert:"—"},
{bn:"301",name:"Saud",rank:"Sergeant",admin:"Sergeant",section:"Patrol Division",points:55,vp:1,stripes:"Ⅲ",service:"2024-03-22",cert:"—"},
{bn:"302",name:"Q7z",rank:"Sergeant",admin:"Sergeant",section:"Patrol Division",points:50,vp:1,stripes:"Ⅲ",service:"2024-03-25",cert:"—"},
{bn:"303",name:"iMohammed",rank:"Sergeant",admin:"Sergeant",section:"Patrol Division",points:48,vp:1,stripes:"Ⅲ",service:"2024-03-27",cert:"—"}
];
let data=JSON.parse(localStorage.getItem("lspdRoster")||"null")||seed, editIndex=-1;
const body=document.getElementById("body"), modal=document.getElementById("modal"), form=document.getElementById("form");
const rankStars={ "Police Chief":"★★★★★","Captain":"Ⅱ","Lieutenant":"Ⅰ","Sergeant":"Ⅲ","Officer":"•" };
function save(){localStorage.setItem("lspdRoster",JSON.stringify(data));}
function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const filtered=data.filter(x=>Object.values(x).join(" ").toLowerCase().includes(q));
 body.innerHTML=""; let last="";
 filtered.forEach((x,i)=>{
   if(x.rank!==last){last=x.rank;let tr=document.createElement("tr");tr.className="group";tr.innerHTML=`<td colspan="11">${x.rank}<span style="float:right">in duty: ${filtered.filter(y=>y.rank===x.rank).length}</span></td>`;body.appendChild(tr)}
   let real=data.indexOf(x),tr=document.createElement("tr");
   tr.innerHTML=`<td>${x.bn||"—"}</td><td><b>${x.name}</b></td><td class="rank">${rankStars[x.rank]||"•"}</td><td>${x.admin||"—"}</td><td>${x.section||"—"}</td><td>${x.points||0}</td><td>${x.vp||0}</td><td>${x.stripes||"—"}</td><td>${x.service||"—"}</td><td>${x.cert||"—"}</td><td class="actions-cell"><button class="iconbtn edit" data-i="${real}">✎</button><button class="iconbtn del" data-i="${real}">🗑</button></td>`;
   body.appendChild(tr);
 });
 document.getElementById("count").textContent=filtered.length+" officers"; 
}
function openForm(i=-1){editIndex=i;modal.classList.add("open");document.getElementById("modalTitle").textContent=i<0?"Add officer":"Edit officer";let x=i<0?{}:data[i];for(const el of form.elements)if(el.name)el.value=x[el.name]??"";}
function close(){modal.classList.remove("open");form.reset();editIndex=-1}
document.getElementById("addBtn").onclick=()=>openForm();
document.getElementById("cancel").onclick=close;
document.getElementById("search").oninput=render;
body.onclick=e=>{let b=e.target.closest("button");if(!b)return;let i=+b.dataset.i;if(b.classList.contains("edit"))openForm(i);else if(b.classList.contains("del")&&confirm("Delete this officer?")){data.splice(i,1);save();render()}};
form.onsubmit=e=>{e.preventDefault();let o={};for(const el of form.elements)if(el.name)o[el.name]=el.value;if(editIndex<0)data.push(o);else data[editIndex]=o;save();render();close()};
document.getElementById("resetBtn").onclick=()=>{if(confirm("Reset to the demo roster?")){data=seed.map(x=>({...x}));save();render()}};
document.getElementById("exportBtn").onclick=()=>{let csv=["BN,Name,Rank,Administrative rank,Section,Points,V.P,Stripes,Service Since,Certificates",...data.map(x=>Object.values(x).map(v=>`"${String(v).replaceAll('"','""')}"`).join(","))].join("\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="lspd-roster.csv";a.click();URL.revokeObjectURL(a.href)};
render();
</script>
</body></html>
